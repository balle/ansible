---
ansible-navigator:
  execution-environment:
    container-engine: podman
    enabled: true
    environment-variables:
      set:
        ANSIBLE_CALLBACK_PLUGINS: $(python3 -m ara.setup.callback_plugins)
        ARA_ALLOWED_HOSTS: '["127.0.0.1", "localhost", "::1"]'
    image: my-ansible-env:latest
    pull:
      policy: missing
