---
- name: Load os specific vars
  ansible.builtin.include_vars: '{{ ansible_os_family }}.yml'

- name: Install latex
  ansible.builtin.package:
    name: '{{ texlive_package }}'
    state: present

- name: Install pdf reader
  ansible.builtin.package:
    name: '{{ my_pdf_reader }}'
    state: present

- name: Install dictionary
  ansible.builtin.package:
    name: ''
    state: present
  when: ansible_os_family != "RedHat" and ansible_os_family != "Debian"

- name: Install dictionary
  ansible.builtin.package:
    name: '{{ my_dict }}'
    state: present
  when: ansible_os_family == "RedHat" or ansible_os_family == "Debian"

- name: Link dic dict
  ansible.builtin.file:
    follow: true
    src: '/usr/local/share/mozilla-dicts/{{ my_dict_lang }}.dic'
    dest: '/usr/local/share/hunspell/{{ my_dict_lang }}.dic'
    state: link
  when: ansible_os_family == "OpenBSD"

- name: Install pandoc
  ansible.builtin.package:
    name: pandoc
    state: present

- name: Install mscorefonts
  ansible.builtin.package:
    name: ttf-mscorefonts-installer
    state: present

- name: Install fonts-ebgaramond
  ansible.builtin.package:
    name: fonts-ebgaramond
    state: present
