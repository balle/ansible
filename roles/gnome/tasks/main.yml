---
- name: Disable auto mount 
  ansible.builtin.command: gsettings set org.gnome.desktop.media-handling automount false
  become_user: "{{ my_user }}"
  become_method: "su"

- name: Disable auto mount open
  ansible.builtin.command: gsettings set org.gnome.desktop.media-handling automount-open false
  become_user: "{{ my_user }}"
  become_method: "su"
