---
- name: Load os specific vars
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install dvdcss
  ansible.builtin.package:
    name: "{{ dvdcss_package }}"
    state: present
  when: ansible_os_family != "Darwin"

- name: Install dvdcss on macos
  community.general.homebrew:
    name: libdvdcss
    state: present
  when: ansible_os_family == "Darwin"

# - name: Reconfigure dvdcss
#   ansible.builtin.command: dpkg-reconfigure -fnoninteractive libdvd-pkg
#   when: ansible_os_family == "Debian"

- name: Install makemkv
  community.general.flatpak:
    name: com.makemkv.MakeMKV
    state: present
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"

- name: Install makemkv on macos
  community.general.homebrew:
    name: makemkv
    state: present
  when: ansible_os_family == "Darwin"

- name: Install handbrake
  ansible.builtin.package:
    name: handbrake
    state: present
  when: ansible_os_family != "Darwin"

- name: Install handbrake on macos
  community.general.homebrew:
    name: handbrake
    state: present
  when: ansible_os_family == "Darwin"

- name: Install lame
  ansible.builtin.package:
    name: lame
    state: present
  when: ansible_os_family != "Darwin"

- name: Install sound juicer
  ansible.builtin.package:
    name: sound-juicer
    state: present
  when: ansible_os_family != "Darwin"

- name: Install streamripper
  ansible.builtin.package:
    name: streamripper
    state: present
  when: ansible_os_family != "Darwin"

- name: Install streamripper on macos
  community.general.homebrew:
    name: streamripper
    state: present
  when: ansible_os_family == "Darwin"

- name: Install youtube-dl
  ansible.builtin.package:
    name: youtube-dl
    state: present
  when: ansible_os_family != "Darwin"

- name: Install youtube-dl on macos
  community.general.homebrew:
    name: youtube-dl
    state: present
  when: ansible_os_family == "Darwin"
