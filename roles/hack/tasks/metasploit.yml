---
- name: Clone metasploit
  ansible.builtin.git:
    dest: '{{ my_home }}/hack/metasploit'
    repo: 'https://github.com/rapid7/metasploit-framework.git'
    version: master

- name: Install rbenv on macos
  ansible.builtin.package:
    name: "postgresql"
    state: present
  when: ansible_os_family == 'Darwin'

- name: Install postgresql
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ postgresql_server }}"
    - "{{ postgresql_server_dev }}"
    - "{{ postgresql_client }}"
  when: ansible_os_family != 'Darwin'

- name: Install rbenv on macos
  ansible.builtin.package:
    name: "rbenv"
    state: present
  when: ansible_os_family == 'Darwin'

- name: Install ruby on macos
  ansible.builtin.command: "{{ item }}"
  run_once: true
  loop:
    - "rbenv install 2.7.2"
    - "rbenv global 2.7.2"
  when: ansible_os_family == 'Darwin'

- name: Install ruby
  ansible.builtin.package:
    name: "{{ ruby_package }}"
    state: present
  when: ansible_os_family != 'Darwin'

- name: Install ruby development files
  ansible.builtin.package:
    name: "{{ ruby_devel_package }}"
    state: present
  when:
    - ansible_os_family != 'OpenBSD'
    - ansible_os_family != 'Darwin'

- name: Install ruby bundler
  ansible.builtin.package:
    name: ruby-bundler
    state: present
  when: ansible_os_family == "Debian" or ansible_os_family == "Archlinux"

- name: Link bundler
  ansible.builtin.file:
    follow: true
    src: '/usr/local/bin/bundle27'
    dest: '/usr/local/bin/bundle'
    state: link
  when: ansible_os_family == 'OpenBSD'

- name: Install pcap development files
  ansible.builtin.package:
    name: "{{ pcap_devel_package }}"
    state: present
  when:
    - ansible_os_family != 'OpenBSD'
    - ansible_os_family != 'Darwin'

- name: Install sqlite development files
  ansible.builtin.package:
    name: "{{ sqlite_devel_package }}"
    state: present
  when:
    - ansible_os_family != 'OpenBSD'
    - ansible_os_family != 'Darwin'

- name: Check if Metasploit Ruby gems are satisfied
  ansible.builtin.command:
    cmd: bundle check
    chdir: "{{ my_home }}/hack/metasploit"
  register: msf_bundle_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "/usr/local/rvm/gems/default/bin:/usr/local/bin:{{ ansible_env.PATH }}"

- name: Install metasploit dependencies
  ansible.builtin.command:
    cmd: bundle install
    chdir: "{{ my_home }}/hack/metasploit"
  changed_when: true
  when: msf_bundle_check.rc != 0
