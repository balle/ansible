---
- name: Install cmake
  ansible.builtin.package:
    name: cmake
    state: present

- name: Install libusb development files
  ansible.builtin.package:
    name: "{{ libusb_dev }}"
    state: present
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"

- name: Install bluez-libs-devel
  ansible.builtin.package:
    name: "{{ bluez_devel_package }}"
    state: present
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"

- name: Install libpcap-devel
  ansible.builtin.package:
    name: "{{ pcap_devel_package }}"
    state: present
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"

- name: Clone libbtbb
  ansible.builtin.git:
    clone: true
    force: true
    dest: '{{ my_home }}/hack/libbtbb'
    repo: 'https://github.com/greatscottgadgets/libbtbb.git'

- name: Create libbtbb build dir 
  ansible.builtin.file:
    state: directory
    path: '{{ my_home }}/hack/libbtbb/build'

- name: Build libbtbb
  ansible.builtin.shell: cmake .. && make install && ldconfig
  args:
    chdir: '{{ my_home }}/hack/libbtbb/build'

- name: Install libbtbb wireshark plugin dependencies
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items:
    - wireshark-dev
    - libwireshark-dev

- name: Create build dirs for libbtbb wireshark plugins 
  ansible.builtin.file:
    state: directory
    path: "{{ my_home }}/hack/libbtbb/wireshark/plugins/{{ item }}/build"
  with_items:
    - btbb
    - btbredr

- name: Ensure python is a link to python3 
  ansible.builtin.file:
    state: link
    src: /usr/bin/python3
    dest: /usr/bin/python

- name: Build libbtbb wireshark plugins
  ansible.builtin.shell: cmake .. && make install 
  args:
    chdir: "{{ my_home }}/hack/libbtbb/wireshark/plugins/{{ item }}/build"
  with_items:
    - btbb
    - btbredr

- name: Clone ubertooth
  ansible.builtin.git:
    dest: '{{ my_home }}/hack/ubertooth'
    repo: 'https://github.com/greatscottgadgets/ubertooth.git'
    version: master

- name: Install ubertooh dependencies
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items:
    - make
    - gcc
    - g++
    - wget
    - pkg-config
    - python3-numpy
    - python3-qtpy
    - python3-distutils
    - python3-setuptools

- name: Create ubertooth build dir
  ansible.builtin.file:
    state: directory
    mode: "755"
    path: '{{ my_home }}/hack/ubertooth/host/build'

- name: Configure ubertooth build with Cmake
  ansible.builtin.command:
    cmd: cmake ..
    chdir: '{{ my_home }}/hack/ubertooth/host/build'
    creates: '{{ my_home }}/hack/ubertooth/host/build/Makefile'

- name: Build ubertooth
  ansible.builtin.command:
    cmd: make install
    chdir: '{{ my_home }}/hack/ubertooth/host/build'
    creates: /usr/local/bin/ubertooth-util
  register: ubertooth_install
  nofity: Update shared library cache

- name: Clone btlejack
  ansible.builtin.git:
    dest: '{{ my_home }}/hack/btlejack'
    depth: 1
    version: master
    repo: https://github.com/virtualabs/btlejack.git
  register: btlejack_repo

- name: Install btlejack
  ansible.builtin.command: python3 setup.py install
  args:
    chdir: '{{ my_home }}/hack/btlejack'
    creates: /usr/local/bin/btlejack
  become: true

- name: Install btlejack firmware build dependencies
  ansible.builtin.package:
    name: yotta
    state: present
  become: true

- name: Ensure yt is a link to yotta
  ansible.builtin.file:
    state: link
    src: /usr/bin/yotta
    dest: /usr/bin/yt

- name: Build btlejack firmware
  ansible.builtin.command:
    cmd: make all
    chdir: '{{ my_home }}/hack/btlejack/btlejack-firmware'
  changed_when: true
  when: btlejack_repo.changed
