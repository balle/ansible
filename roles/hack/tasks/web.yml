---
- name: Install zed attack proxy on macOS
  ansible.builtin.package:
    name: "{{ zap_package }}"
    state: present
  ignore_errors: true
  when: ansible_os_family == 'Darwin'

- name: Install zed attack proxy on OpenBSD
  ansible.builtin.package:
    name: "{{ zap_package }}"
    state: present
  when:
    - ansible_os_family == 'OpenBSD'

- name: Install zed attack proxy on Linux
  community.general.flatpak:
    name: "{{ zap_package }}"
    state: present
    classic: true
  when:
    - ansible_os_family == 'Debian' or ansible_os_family == "RedHat"

- name: Install sqlmap
  ansible.builtin.package:
    name: sqlmap
    state: present

- name: Clone nosqlmap
  ansible.builtin.git:
    dest: "{{ my_home }}/hack/nosqlmap"
    repo: "https://github.com/SirKnightV/NoSQLMap-Python3-update.git"
    version: master
  register: nosqlmap

- name: Install nosqlmap requirements
  ansible.builtin.command: pip3 install -r requirements.txt
  args:
    chdir: "{{ my_home }}/hack/nosqlmap"
  changed_when: true
  when: nosqlmap.changed

- name: Install pymongo
  ansible.builtin.package:
    name: python3-pymongo
    state: present

- name: Install whatweb
  ansible.builtin.package:
    name: whatweb
    state: present

- name: Install nikto
  ansible.builtin.package:
    name: whatweb
    state: present

- name: Clone beef
  ansible.builtin.git:
    dest: "{{ my_home }}/hack/beef"
    repo: "https://github.com/beefproject/beef.git"
    version: master
  register: beef

- name: Install beef
  ansible.builtin.shell: yes | ./install
  args:
    chdir: "{{ my_home }}/hack/beef"
  when: beef.changed
