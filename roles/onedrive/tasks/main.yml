---

- name: Install onedrive
  ansible.builtin.package:
    name: onedrive
    state: present
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"

- name: Start onedrive service
  ansible.builtin.systemd:
    name: onedrive
    enabled: true
    state: started
    scope: user
  become_user: "{{ my_user }}"
  become_method: "su"
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
