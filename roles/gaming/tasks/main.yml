---
- name: Install Lutris
  community.general.flatpak:
    name: net.lutris.Lutris
    state: present

- name: Create DPKG architecture
  ansible.builtin.file:
    path: /var/lib/dpkg/arch
    state: touch
    mode: "644"
  register: dpkg_architecture

- name: Check DPKG architecture
  ansible.builtin.lineinfile:
    name: /var/lib/dpkg/arch
    line: i386
    state: present

- name: Check configured foreign dpkg architectures
  ansible.builtin.command: dpkg --print-foreign-architectures
  register: dpkg_foreign_archs
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Activate i386 packages for APT
  ansible.builtin.command: dpkg --add-architecture i386
  become: true
  notify: Refresh apt cache
  changed_when: true
  when:
    - ansible_os_family == "Debian"
    - "'i386' not in dpkg_foreign_archs.stdout_lines"

- name: Enable the RPM Fusion repository
  ansible.builtin.dnf:
    name: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install Steam
  ansible.builtin.package:
    name: steam
    state: present
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
