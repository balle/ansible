---

- name: Configure user ksh
  ansible.builtin.copy:
    src: kshrc
    dest: '{{ my_home }}/.kshrc'
    owner: '{{ my_user }}'
    group: '{{ my_group }}'
    mode: "600"
  when: ansible_os_family == 'OpenBSD'

- name: Profile for user
  ansible.builtin.copy:
    src: profile
    dest: '{{ my_home }}/.profile'
    owner: '{{ my_user }}'
    group: '{{ my_group }}'
    mode: "600"
  when: ansible_os_family == 'OpenBSD'

- name: Configure root ksh
  ansible.builtin.copy:
    src: kshrc
    dest: '/root/.kshrc'
    owner: 'root'
    group: 'wheel'
    mode: "600"
  when: ansible_os_family == 'OpenBSD'

- name: Profile for root
  ansible.builtin.copy:
    src: profile
    dest: '/root/.profile'
    owner: 'root'
    group: 'wheel'
    mode: "600"
  when: ansible_os_family == 'OpenBSD'
