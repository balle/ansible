---

- name: Copy kernel security grub conf
  ansible.builtin.copy:
    src: grub.conf
    dest: /etc/grub.d/01_security.cfg
    owner: root
    group: root
    mode: "644"
  when: ansible_os_family == "Debian"
  register: kernel_config

- name: Update grub config
  command: update-grub
  when: kernel_config.changed
