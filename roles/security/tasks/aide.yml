---
- name: Install aide
  ansible.builtin.package:
    name: 'aide'
    state: present

- name: Configure aide
  ansible.builtin.copy:
    src: "{{ aide_config }}"
    dest: '{{ aide_config_dest }}'
    owner: 'root'
    group: 'root'
    mode: "600"
  register: aide_config

- name: Init aide db
  ansible.builtin.command: aide --init --config {{ aide_config_dest }}
  when: aide_config.changed
