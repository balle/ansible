---
- name: Load os specific vars
  ansible.builtin.include_vars: '{{ ansible_os_family }}.yml'

- name: Install emacs
  ansible.builtin.package:
    name: '{{ emacs_package }}'
    state: present

- name: Install mg
  ansible.builtin.package:
    name: 'mg'
    state: present
  when: ansible_os_family != "OpenBSD"

- name: Configure mg
  ansible.builtin.copy:
    src: mg.conf
    dest: '{{ my_home }}/.mg'
    owner: '{{ my_user }}'
    group: '{{ my_group }}'
    mode: "600"

- name: Install xclip
  ansible.builtin.package:
    name: 'xclip'
    state: present

- name: Install emacs auctex
  ansible.builtin.package:
    name: '{{ auctex_package }}'
    state: present
  when: ansible_os_family != "OpenBSD" and ansible_os_family != "Archlinux"

- name: Install gxmessage
  ansible.builtin.package:
    name: gxmessage
    state: present
  when: ansible_os_family != "OpenBSD"

- name: Clone emacs config
  ansible.builtin.git:
    repo: https://github.com/balle/emacs.git
    dest: "{{ my_home }}/emacs"
    depth: 1
    version: master
  become: true
  become_user: "{{ my_user }}"
  when: ansible_os_family != "OpenBSD"

- name: Clone emacs config
  ansible.builtin.git:
    repo: https://github.com/balle/emacs.git
    dest: '{{ my_home }}/emacs'
    depth: 1
    version: master
  when: ansible_os_family == "OpenBSD"

- name: Link .emacs
  ansible.builtin.file:
    follow: true
    src: '{{ my_home }}/emacs/.emacs'
    dest: '{{ my_home }}/.emacs'
    state: link

- name: Link .emacs.d
  ansible.builtin.file:
    follow: true
    src: '{{ my_home }}/emacs/.emacs.d'
    dest: '{{ my_home }}/.emacs.d'
    state: link
