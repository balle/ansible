---

- name: Install tcpdump
  ansible.builtin.package:
    name: 'tcpdump'
    state: present
  when: ansible_os_family != 'OpenBSD'

- name: Install whois
  ansible.builtin.package:
    name: 'whois'
    state: present
  when: ansible_os_family != 'OpenBSD' or ansible_os_family == 'Darwin'

- name: Install jnettop
  ansible.builtin.package:
    name: 'jnettop'
    state: present


- name: Install minicom
  ansible.builtin.package:
    name: 'minicom'
    state: present
