---
- name: Enable apmd
  ansible.builtin.lineinfile:
    path: /etc/rc.conf.local
    line: 'apmd_flags='
    insertbefore: EOF
  when: ansible_os_family == "OpenBSD"

- name: Install anacron
  ansible.builtin.package:
    name: anacron
    state: present
  when: ansible_os_family == "RedHat" or ansible_os_family == "Debian"

- name: Start anacron service
  ansible.builtin.service:
    name: anacron
    enabled: true
    state: started
  when: ansible_os_family == "RedHat" or ansible_os_family == "Debian"

- name: Install tlp
  ansible.builtin.package:
    name: tlp
    state: present
  when: ansible_os_family == "RedHat" or ansible_os_family == "Debian"

- name: Copy tlp config
  ansible.builtin.copy:
    src: tlp.conf
    dest: /etc/tlp.conf
    owner: root
    group: root
    mode: "644"
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"

- name: Start tlp service
  ansible.builtin.service:
    name: tlp
    enabled: true
    state: started
  when: ansible_os_family == "RedHat" or ansible_os_family == "Debian"

- name: Dont suspend on lid close when on external power
  ansible.builtin.lineinfile:
    path: '/etc/systemd/logind.conf'
    backrefs: true
    regexp: '^\#HandleLidSwitchExternalPower\=suspend$'
    line: 'HandleLidSwitchExternalPower=ignore'
