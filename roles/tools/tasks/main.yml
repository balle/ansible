---
- name: Load os specific vars
  ansible.builtin.include_vars: '{{ ansible_os_family }}.yml'

- name: Install iotop
  ansible.builtin.package:
    name: iotop
    state: present

- name: Configure ctop repo
  ansible.builtin.copy:
    src: "azlux.list"
    dest: "/etc/apt/sources.list.d/azlux.list"
    mode: 644
  when: ansible_os_family == "Debian"

- name: Copy ctop gpg key
  ansible.builtin.copy:
    src: "azlux-archive-keyring.gpg"
    dest: "/usr/share/keyrings/azlux-archive-keyring.gpg"
    mode: 644
  when: ansible_os_family == "Debian"

- name: Install ctop
  ansible.builtin.package:
    name: "docker-ctop"
    state: present
  when: ansible_os_family == "Debian"

- name: Install golang
  ansible.builtin.package:
    name: '{{ go_package }}'
    state: present

- name: Check if gotop is installed
  ansible.builtin.command: which gotop
  register: gotop_check
  ignore_errors: true
  changed_when: false

- name: Clone gotop repo
  ansible.builtin.git:
    repo: https://github.com/cjbassi/gotop.git
    dest: "{{ my_home }}/gotop"
    clone: true
    force: true
  register: gotop_src
  when: gotop_check.rc == 1

- name: Build gotop
  ansible.builtin.shell: "cd {{ my_home }}/gotop && go build"
  when:
    - gotop_check.rc == 1
    - gotop_src.changed

- name: Copy gotop to /usr/local/bin
  ansible.builtin.copy:
    src: "{{ my_home }}/gotop/gotop"
    dest: /usr/local/bin/gotop
    mode: "755"
  when:
    - gotop_check.rc == 1
    - gotop_src.changed

- name: Install clustershell
  ansible.builtin.package:
    name: clustershell
    state: present
