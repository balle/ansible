---
- name: Load os specific vars
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Fstab optimizations
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: defaults
    replace: defaults,noatime

- name: Fstab optimizations
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: errors=remount-ro
    replace: errors=remount-ro,noatime

- name: Configure sysctl
  ansible.builtin.copy:
    src: "{{ sysctl_config }}"
    dest: "{{ sysctl_config_dest }}"
    owner: "root"
    group: "root"
    mode: "600"
  notify: Reload sysctl

- name: Hide pids from other users
  ansible.builtin.blockinfile:
    block: "proc                    /proc                   proc    nosuid,noexec,nodev,hidepid=2 0 0"
    path: /etc/fstab
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat" or ansible_os_family == "Archlinux"

- name: Copy journald config
  ansible.builtin.copy:
    src: journald.conf
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: "644"
  register: journald_config
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat" or ansible_os_family == "Archlinux"

- name: Restart journald on config change
  ansible.builtin.service:
    name: systemd-journald
    enabled: true
    state: restarted
  when: journald_config.changed

- name: Install macchanger
  ansible.builtin.package:
    name: macchanger
    state: present
  register: macchanger
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat" or ansible_os_family == "Archlinux"

- name: Configure macchanger
  ansible.builtin.copy:
    src: macchanger
    dest: /etc/default/macchanger
    owner: root
    group: root
    mode: "644"
  when: ansible_os_family == "Debian"

- name: Install smartmontools
  ansible.builtin.package:
    name: smartmontools
    state: present
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"

- name: Start smartmontools service
  ansible.builtin.service:
    name: smartmontools
    enabled: true
    state: started
  when: ansible_os_family == "RedHat" or ansible_os_family == "Debian"

- name: Install flatpak
  ansible.builtin.package:
    name: flatpak
    state: present

- name: Install apt-file
  ansible.builtin.package:
    name: apt-file
    state: present
  register: apt_file
  when: ansible_os_family == "Debian"

- name: Init apt-file
  ansible.builtin.command: apt-file update
  when: apt_file.changed

- name: Disable polkit for NetworkManager
  ansible.builtin.copy:
    src: nm-polkit.disable
    dest: /etc/NetworkManager/conf.d/any-user.conf
    owner: root
    group: root
    mode: "644"
  when: ansible_os_family == "Debian"

- name: Restart NetworkManager
  ansible.builtin.service:
    name: NetworkManager
    enabled: true
    state: restarted
  when: ansible_os_family == "Debian"
