---
- name: Load os specific vars
  ansible.builtin.include_vars: '{{ ansible_os_family }}.yml'

- name: Install zsh
  ansible.builtin.package:
    name: zsh
    state: present

- name: Install zsh autojump
  ansible.builtin.package:
    name: '{{ autojump_package }}'
  when: ansible_os_family != "OpenBSD"

- name: Configure zsh
  ansible.builtin.template:
    src: zshrc
    dest: '{{ my_home }}/.zshrc'
    owner: '{{ my_user }}'
    group: '{{ my_group }}'
    mode: "600"
