---
- name: Install gcc
  ansible.builtin.package:
    name: gcc
    state: present
  when: ansible_os_family != 'OpenBSD'

- name: Install make
  ansible.builtin.package:
    name: make
    state: present
  when: ansible_os_family != 'OpenBSD'

- name: Install automake
  ansible.builtin.package:
    name: automake
    state: present
  when: ansible_os_family != 'OpenBSD'

- name: Install autoconf
  ansible.builtin.package:
    name: autoconf
    state: present
  when: ansible_os_family != 'OpenBSD'
