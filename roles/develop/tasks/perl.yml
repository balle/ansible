---
- name: Install libperl-dev
  ansible.builtin.package:
    name: libperl-dev
    state: present
  when: ansible_os_family == 'Debian'

- name: Install perl-devel
  ansible.builtin.package:
    name: perl-devel
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install cpanminus
  ansible.builtin.package:
    name: cpanminus
    state: present
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Archlinux'

- name: Install perl-App-cpanminus
  ansible.builtin.package:
    name: perl-App-cpanminus
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install perlbrew
  ansible.builtin.package:
    name: perlbrew
    state: present

- name: Install Perl::LanguageServer
  ansible.builtin.command: cpanm Perl::LanguageServer
  args:
    creates: "/usr/local/bin/perl-language-server"

- name: Install Devel::Cover
  ansible.builtin.package:
    name: libdevel-cover-perl
    state: present
  when: ansible_os_family == 'Debian'
